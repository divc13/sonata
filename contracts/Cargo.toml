[workspace]
resolver = "2"
members = ["mock-usdc", "song-wallet", "master-nft", "market"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
near-sdk = { version = "5.30.0", features = ["legacy"] }
serde = "=1.0.229"
serde_json = "=1.0.154"
bs58 = "=0.5.1"

[profile.release]
codegen-units = 1
# Optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Extra safety checks on arithmetic operations.
overflow-checks = true
